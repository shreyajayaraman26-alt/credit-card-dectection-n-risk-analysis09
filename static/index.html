<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraud & Risk Decision Engine | Executive Console</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Inter & JetBrains Mono fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            neutral: {
              850: '#1b1c21',
              900: '#141519',
              950: '#0c0d10',
            },
            accent: {
              50: '#fbf9f6',
              100: '#f5f0e8',
              200: '#ebd9c6',
              300: '#ddc0a2',
              400: '#cbb094',
              500: '#b89f80',
              600: '#a38a6a',
              700: '#877054',
              800: '#6d5a44',
              900: '#584938',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0c0d10;
      color: #d4d4d8;
      min-height: 100vh;
      letter-spacing: -0.01em;
    }
    .panel-card {
      background-color: #141519;
      border: 1px solid #23252c;
    }
    .sub-card {
      background-color: #1b1c22;
      border: 1px solid #292c35;
    }
    input[type="range"] {
      accent-color: #cbb094;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #0c0d10;
    }
    ::-webkit-scrollbar-thumb {
      background: #2b2e38;
      border-radius: 3px;
    }
  </style>
</head>
<body class="antialiased selection:bg-stone-700 selection:text-stone-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CURRENCIES = {
      EUR: { symbol: '€', label: 'EUR (€)', rate: 1.0 },
      INR: { symbol: '₹', label: 'INR (₹)', rate: 90.0 },
      USD: { symbol: '$', label: 'USD ($)', rate: 1.08 },
      GBP: { symbol: '£', label: 'GBP (£)', rate: 0.85 },
    };

    function App() {
      const [activeTab, setActiveTab] = useState('simulator');
      const [currency, setCurrency] = useState('EUR');
      const [modelInfo, setModelInfo] = useState(null);
      const [samplePool, setSamplePool] = useState({ fraud: [], legit: [] });
      const [selectedPreset, setSelectedPreset] = useState('fraud_0');
      const [loading, setLoading] = useState(false);
      const [scoreResult, setScoreResult] = useState(null);

      // Raw transaction features (V1-V28, Time, Amount)
      const [txData, setTxData] = useState({
        Time: 406.0,
        Amount: 1809.68,
        V1: -2.31, V2: 1.95, V3: -1.60, V4: 3.99, V5: -0.52,
        V6: -1.42, V7: -2.53, V8: 1.39, V9: -2.77, V10: -2.77,
        V11: 3.20, V12: -2.89, V13: -0.59, V14: -4.28, V15: 0.38,
        V16: -1.14, V17: -2.83, V18: -0.01, V19: 0.41, V20: 0.12,
        V21: 0.51, V22: -0.03, V23: -0.46, V24: 0.32, V25: 0.04,
        V26: 0.17, V27: 0.26, V28: -0.14
      });

      // Batch evaluation state
      const [batchResults, setBatchResults] = useState(null);
      const [batchLoading, setBatchLoading] = useState(false);

      useEffect(() => {
        fetchModelInfo();
        fetchSamples();
      }, []);

      const fetchModelInfo = async () => {
        try {
          const res = await fetch('/api/model-info');
          if (res.ok) {
            const data = await res.json();
            setModelInfo(data);
          }
        } catch (err) {
          console.error("Model info fetch failed:", err);
        }
      };

      const fetchSamples = async () => {
        try {
          const res = await fetch('/api/sample-transactions');
          if (res.ok) {
            const data = await res.json();
            setSamplePool(data);
            if (data.fraud && data.fraud.length > 0) {
              loadPresetData(data.fraud[0]);
            }
          }
        } catch (err) {
          console.error("Sample fetch failed:", err);
        }
      };

      const loadPresetData = (sampleRow) => {
        const newTx = {
          Time: sampleRow.Time !== undefined ? sampleRow.Time : 406.0,
          Amount: sampleRow.Amount !== undefined ? sampleRow.Amount : 120.0,
        };
        for (let i = 1; i <= 28; i++) {
          newTx[`V${i}`] = sampleRow[`V${i}`] !== undefined ? sampleRow[`V${i}`] : 0.0;
        }
        setTxData(newTx);
        scoreTransaction(newTx);
      };

      const handlePresetChange = (presetKey) => {
        setSelectedPreset(presetKey);
        if (presetKey === 'fraud_0' && samplePool.fraud && samplePool.fraud.length > 0) {
          loadPresetData(samplePool.fraud[0]);
        } else if (presetKey === 'fraud_1' && samplePool.fraud && samplePool.fraud.length > 1) {
          loadPresetData(samplePool.fraud[1]);
        } else if (presetKey === 'fraud_2' && samplePool.fraud && samplePool.fraud.length > 2) {
          loadPresetData(samplePool.fraud[2]);
        } else if (presetKey === 'legit_0' && samplePool.legit && samplePool.legit.length > 0) {
          loadPresetData(samplePool.legit[0]);
        } else if (presetKey === 'legit_1' && samplePool.legit && samplePool.legit.length > 1) {
          loadPresetData(samplePool.legit[1]);
        } else if (presetKey === 'coffee_legit') {
          const coffee = {
            Time: 43200, // 12:00 PM
            Amount: 4.50,
            V1: -0.2, V2: 0.1, V3: 0.8, V4: -0.4, V5: 0.3,
            V6: -0.1, V7: 0.2, V8: 0.05, V9: -0.1, V10: -0.05,
            V11: 0.2, V12: 0.4, V13: -0.2, V14: 0.1, V15: 0.8,
            V16: -0.3, V17: 0.1, V18: 0.2, V19: -0.1, V20: -0.05,
            V21: -0.05, V22: 0.1, V23: 0.02, V24: 0.1, V25: -0.2,
            V26: 0.05, V27: 0.01, V28: 0.01
          };
          setTxData(coffee);
          scoreTransaction(coffee);
        } else if (presetKey === 'night_high') {
          const nightTx = {
            Time: 7200, // 02:00 AM
            Amount: 2850.00,
            V1: -1.8, V2: 2.1, V3: -2.4, V4: 4.2, V5: -1.2,
            V6: -0.8, V7: -2.9, V8: 1.5, V9: -2.3, V10: -3.1,
            V11: 3.5, V12: -3.8, V13: 0.1, V14: -5.1, V15: 0.2,
            V16: -2.4, V17: -3.9, V18: -0.6, V19: 0.8, V20: 0.4,
            V21: 0.6, V22: -0.1, V23: -0.5, V24: 0.2, V25: 0.1,
            V26: 0.2, V27: 0.3, V28: -0.1
          };
          setTxData(nightTx);
          scoreTransaction(nightTx);
        }
      };

      const scoreTransaction = async (dataToScore = txData) => {
        setLoading(true);
        try {
          const res = await fetch('/api/score', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dataToScore)
          });
          if (res.ok) {
            const result = await res.json();
            setScoreResult(result);
          }
        } catch (err) {
          console.error("Score error:", err);
        } finally {
          setLoading(false);
        }
      };

      const handleParamChange = (field, val) => {
        const updated = { ...txData, [field]: parseFloat(val) };
        setTxData(updated);
        setSelectedPreset('custom');
        scoreTransaction(updated);
      };

      const runBatchSimulation = async () => {
        setBatchLoading(true);
        try {
          const res = await fetch('/api/batch-score', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ count: 50 })
          });
          if (res.ok) {
            const data = await res.json();
            setBatchResults(data);
          }
        } catch (err) {
          console.error("Batch simulation error:", err);
        } finally {
          setBatchLoading(false);
        }
      };

      const formatAmount = (baseAmt) => {
        const curr = CURRENCIES[currency] || CURRENCIES.EUR;
        const converted = (baseAmt * curr.rate);
        return `${curr.symbol}${converted.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      };

      const hourOfDay = ((txData.Time % 86400) / 3600);
      const isNight = hourOfDay < 6.0 || hourOfDay >= 22.0;

      return (
        <div className="flex flex-col min-h-screen">
          {/* Executive Muted Topbar */}
          <header className="border-b border-zinc-800/80 bg-neutral-900/95 sticky top-0 z-40 backdrop-blur-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              
              {/* Brand Title */}
              <div className="flex items-center space-x-3">
                <div className="h-7 w-7 rounded-md bg-zinc-800 border border-zinc-700 flex items-center justify-center font-mono font-medium text-accent-400 text-xs shadow-sm">
                  FR
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-sm font-medium text-zinc-100 tracking-tight">Fraud & Risk Decision Console</h1>
                    <span className="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium bg-zinc-800 text-zinc-300 border border-zinc-700">
                      Engine Active
                    </span>
                  </div>
                  <p className="text-[11px] text-zinc-400">FastAPI + React 18 • Dual-Model Hybrid Risk Architecture</p>
                </div>
              </div>

              {/* Navigation & Currency Controls */}
              <div className="flex items-center space-x-3">
                {/* Currency Selector */}
                <div className="flex items-center bg-zinc-900 rounded-lg p-1 border border-zinc-800">
                  <span className="text-[11px] text-zinc-400 px-2 font-medium">Currency:</span>
                  {Object.keys(CURRENCIES).map((cKey) => (
                    <button
                      key={cKey}
                      onClick={() => setCurrency(cKey)}
                      className={`px-2.5 py-1 text-xs rounded-md font-medium transition-all ${
                        currency === cKey
                          ? 'bg-zinc-800 text-zinc-100 shadow-sm border border-zinc-700'
                          : 'text-zinc-400 hover:text-zinc-200'
                      }`}
                    >
                      {CURRENCIES[cKey].symbol} {cKey}
                    </button>
                  ))}
                </div>

                {/* Tabs */}
                <div className="flex items-center bg-zinc-900 rounded-lg p-1 border border-zinc-800">
                  <button
                    onClick={() => setActiveTab('simulator')}
                    className={`px-3 py-1 text-xs rounded-md font-medium transition-all ${
                      activeTab === 'simulator' 
                        ? 'bg-zinc-800 text-accent-300 shadow-sm border border-zinc-700' 
                        : 'text-zinc-400 hover:text-zinc-200'
                    }`}
                  >
                    Analyzer
                  </button>
                  <button
                    onClick={() => { setActiveTab('batch'); if (!batchResults) runBatchSimulation(); }}
                    className={`px-3 py-1 text-xs rounded-md font-medium transition-all ${
                      activeTab === 'batch' 
                        ? 'bg-zinc-800 text-accent-300 shadow-sm border border-zinc-700' 
                        : 'text-zinc-400 hover:text-zinc-200'
                    }`}
                  >
                    Batch Stream
                  </button>
                  <button
                    onClick={() => setActiveTab('metrics')}
                    className={`px-3 py-1 text-xs rounded-md font-medium transition-all ${
                      activeTab === 'metrics' 
                        ? 'bg-zinc-800 text-accent-300 shadow-sm border border-zinc-700' 
                        : 'text-zinc-400 hover:text-zinc-200'
                    }`}
                  >
                    Model Metrics
                  </button>
                </div>

                <a
                  href="/docs"
                  target="_blank"
                  className="text-xs font-medium text-zinc-400 hover:text-zinc-200 border border-zinc-800 px-3 py-1.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 transition-colors"
                >
                  API Docs ↗
                </a>
              </div>

            </div>
          </header>

          {/* Body Content */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">

            {/* TAB 1: TRANSACTION SIMULATOR */}
            {activeTab === 'simulator' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">

                {/* Left: Input & Preset Panel (7 cols) */}
                <div className="lg:col-span-7 space-y-5">
                  <div className="panel-card p-5 rounded-xl space-y-4">
                    
                    {/* Header with Presets */}
                    <div className="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-zinc-800">
                      <div>
                        <h2 className="text-sm font-semibold text-zinc-200">Transaction Parameters</h2>
                        <p className="text-xs text-zinc-400">Select a real Kaggle case study or adjust values</p>
                      </div>

                      <div className="flex items-center gap-2">
                        <label className="text-xs text-zinc-400">Load Case:</label>
                        <select
                          value={selectedPreset}
                          onChange={(e) => handlePresetChange(e.target.value)}
                          className="bg-neutral-900 border border-zinc-700/80 text-xs text-zinc-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-zinc-500"
                        >
                          <optgroup label="Historical Confirmed Fraud Cases">
                            <option value="fraud_0">Confirmed Fraud #1 (High-Value)</option>
                            <option value="fraud_1">Confirmed Fraud #2 (Standard Card)</option>
                            <option value="fraud_2">Confirmed Fraud #3 (Online Transfer)</option>
                          </optgroup>
                          <optgroup label="Legitimate Transaction Cases">
                            <option value="legit_0">Normal Spend #1</option>
                            <option value="legit_1">Normal Spend #2</option>
                            <option value="coffee_legit">Coffee Purchase (Midday)</option>
                          </optgroup>
                          <optgroup label="Edge Cases">
                            <option value="night_high">Overnight Anomaly (02:00 AM)</option>
                            <option value="custom">Custom Manual Inputs</option>
                          </optgroup>
                        </select>
                      </div>
                    </div>

                    {/* Primary Inputs */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div className="sub-card p-3 rounded-lg">
                        <label className="text-xs text-zinc-400 font-medium block mb-1">Amount</label>
                        <div className="relative">
                          <span className="absolute left-2.5 top-1.5 text-zinc-400 font-mono text-xs">
                            {CURRENCIES[currency].symbol}
                          </span>
                          <input
                            type="number"
                            min="0"
                            step="0.1"
                            value={(txData.Amount * (CURRENCIES[currency].rate || 1.0)).toFixed(2)}
                            onChange={(e) => {
                              const inputVal = parseFloat(e.target.value) || 0;
                              const baseVal = inputVal / (CURRENCIES[currency].rate || 1.0);
                              handleParamChange('Amount', baseVal);
                            }}
                            className="w-full bg-neutral-900 border border-zinc-700/80 rounded-md pl-6 pr-2 py-1 font-mono text-sm text-zinc-100 focus:outline-none focus:border-zinc-500"
                          />
                        </div>
                        <span className="text-[10px] text-zinc-400 mt-1 block">
                          Base: €{txData.Amount.toFixed(2)} EUR
                        </span>
                      </div>

                      <div className="sub-card p-3 rounded-lg">
                        <div className="flex justify-between items-center mb-1">
                          <label className="text-xs text-zinc-400 font-medium">Time of Day</label>
                          <span className="text-xs font-mono text-accent-400">{hourOfDay.toFixed(1)}h</span>
                        </div>
                        <input
                          type="range"
                          min="0"
                          max="86400"
                          step="900"
                          value={txData.Time % 86400}
                          onChange={(e) => handleParamChange('Time', e.target.value)}
                          className="w-full mt-1.5"
                        />
                        <div className="flex justify-between text-[10px] text-zinc-400 mt-1 font-mono">
                          <span>00:00</span>
                          <span>12:00</span>
                          <span>24:00</span>
                        </div>
                      </div>

                      <div className="sub-card p-3 rounded-lg flex flex-col justify-between">
                        <label className="text-xs text-zinc-400 font-medium">Temporal Context</label>
                        <div className="flex items-center gap-2 mt-1">
                          <span className={`text-xs px-2 py-0.5 rounded font-medium ${
                            isNight
                              ? 'bg-amber-950/40 text-amber-300/80 border border-amber-900/40'
                              : 'bg-emerald-950/40 text-emerald-300/80 border border-emerald-900/40'
                          }`}>
                            {isNight ? 'Night (22:00-06:00)' : 'Day Business Hours'}
                          </span>
                        </div>
                        <span className="text-[10px] text-zinc-400 mt-1">
                          Log(Amt): {Math.log1p(Math.max(txData.Amount, 0)).toFixed(2)}
                        </span>
                      </div>
                    </div>

                    {/* Key Anomaly Indicators */}
                    <div className="space-y-2 pt-1">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-semibold text-zinc-300">Key PCA Dimension Indicators</span>
                        <span className="text-[11px] text-zinc-400">Sensitive components (V14, V4, V12, V10, V17)</span>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                        {[
                          { key: 'V14', label: 'V14 (Identity / High Risk)' },
                          { key: 'V4', label: 'V4 (Deviation Metric)' },
                          { key: 'V12', label: 'V12 (Velocity Discrepancy)' },
                          { key: 'V10', label: 'V10 (Channel Outlier)' },
                          { key: 'V17', label: 'V17 (Cardholder Cluster)' },
                          { key: 'V1', label: 'V1 (Component 1)' },
                          { key: 'V2', label: 'V2 (Component 2)' },
                          { key: 'V3', label: 'V3 (Component 3)' },
                        ].map(({ key, label }) => {
                          const val = txData[key] || 0.0;
                          const isWarning = (key === 'V14' && val < -2.0) || (key === 'V4' && val > 2.0) || (key === 'V12' && val < -2.0);
                          return (
                            <div key={key} className={`p-2.5 rounded-lg border ${
                              isWarning ? 'bg-rose-950/20 border-rose-900/40' : 'bg-neutral-900/80 border-zinc-800'
                            }`}>
                              <div className="flex justify-between items-center text-xs mb-1">
                                <span className={`font-mono text-[11px] font-medium ${isWarning ? 'text-rose-300/90' : 'text-zinc-400'}`}>
                                  {key}
                                </span>
                                <span className="font-mono text-xs text-zinc-200">{val.toFixed(2)}</span>
                              </div>
                              <input
                                type="range"
                                min="-6.0"
                                max="6.0"
                                step="0.1"
                                value={val}
                                onChange={(e) => handleParamChange(key, e.target.value)}
                                className="w-full"
                              />
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    {/* Secondary Dimensions Accordion */}
                    <details className="group pt-1">
                      <summary className="text-xs text-zinc-400 hover:text-zinc-200 cursor-pointer font-medium select-none">
                        ▸ View remaining PCA feature dimensions (V5–V9, V11, V13, V15–V16, V18–V28)
                      </summary>
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-3">
                        {Array.from({ length: 28 }, (_, i) => `V${i + 1}`)
                          .filter(k => !['V14', 'V4', 'V12', 'V10', 'V17', 'V1', 'V2', 'V3'].includes(k))
                          .map((key) => (
                            <div key={key} className="bg-neutral-900/60 p-2 rounded border border-zinc-800">
                              <div className="flex justify-between items-center text-[10px] mb-0.5 font-mono">
                                <span className="text-zinc-400">{key}</span>
                                <span className="text-zinc-300">{(txData[key] || 0.0).toFixed(2)}</span>
                              </div>
                              <input
                                type="range"
                                min="-5.0"
                                max="5.0"
                                step="0.2"
                                value={txData[key] || 0.0}
                                onChange={(e) => handleParamChange(key, e.target.value)}
                                className="w-full"
                              />
                            </div>
                          ))}
                      </div>
                    </details>

                  </div>
                </div>

                {/* Right: Decision & Explainability Panel (5 cols) */}
                <div className="lg:col-span-5 space-y-5">
                  {scoreResult ? (
                    <div className="space-y-4">
                      
                      {/* Decision Card */}
                      <div className={`p-5 rounded-xl border ${
                        scoreResult.action === 'APPROVE'
                          ? 'panel-card border-emerald-900/50 bg-emerald-950/20'
                          : scoreResult.action === 'REVIEW'
                          ? 'panel-card border-amber-900/50 bg-amber-950/20'
                          : 'panel-card border-rose-900/50 bg-rose-950/20'
                      }`}>
                        
                        <div className="flex items-center justify-between mb-3">
                          <span className="text-xs font-semibold uppercase tracking-wider text-zinc-400">Risk Assessment</span>
                          <span className={`px-2.5 py-0.5 rounded text-xs font-semibold font-mono ${
                            scoreResult.action === 'APPROVE' ? 'bg-emerald-950/80 text-emerald-300 border border-emerald-800/50' :
                            scoreResult.action === 'REVIEW' ? 'bg-amber-950/80 text-amber-300 border border-amber-800/50' :
                            'bg-rose-950/80 text-rose-300 border border-rose-800/50'
                          }`}>
                            LEVEL: {scoreResult.risk_level}
                          </span>
                        </div>

                        <div className="flex items-baseline justify-between mb-3">
                          <div>
                            <div className={`text-2xl font-bold ${
                              scoreResult.action === 'APPROVE' ? 'text-emerald-300' :
                              scoreResult.action === 'REVIEW' ? 'text-amber-300' : 'text-rose-300'
                            }`}>
                              {scoreResult.action}
                            </div>
                            <p className="text-xs text-zinc-300 mt-0.5">
                              {scoreResult.action === 'APPROVE' && 'Transaction cleared. Low risk profile.'}
                              {scoreResult.action === 'REVIEW' && 'Requires secondary verification / manual review.'}
                              {scoreResult.action === 'FLAG' && 'High fraud probability. Transaction declined.'}
                            </p>
                          </div>
                          <div className="text-right">
                            <span className="text-2xl font-bold font-mono text-zinc-100">
                              {(scoreResult.risk_score * 100).toFixed(1)}%
                            </span>
                            <span className="block text-[10px] text-zinc-400">Risk Index</span>
                          </div>
                        </div>

                        {/* Progress Bar */}
                        <div className="w-full bg-zinc-900 rounded-full h-2 border border-zinc-800 overflow-hidden">
                          <div
                            className={`h-full transition-all duration-300 ${
                              scoreResult.action === 'APPROVE' ? 'bg-emerald-600/90' :
                              scoreResult.action === 'REVIEW' ? 'bg-amber-600/90' : 'bg-rose-600/90'
                            }`}
                            style={{ width: `${Math.min(Math.max(scoreResult.risk_score * 100, 3), 100)}%` }}
                          />
                        </div>
                        <div className="flex justify-between text-[10px] text-zinc-400 font-mono mt-1">
                          <span>0% Safe</span>
                          <span>30% Review</span>
                          <span>70% Decline</span>
                          <span>100%</span>
                        </div>
                      </div>

                      {/* Dual Signal Split */}
                      <div className="panel-card p-4 rounded-xl space-y-3">
                        <span className="text-xs font-semibold text-zinc-300 block">Hybrid Model Signal Breakdown</span>
                        <div className="grid grid-cols-2 gap-3">
                          <div className="sub-card p-3 rounded-lg border-l-2 border-l-stone-500">
                            <div className="flex justify-between text-xs text-zinc-400 mb-0.5">
                              <span>Random Forest</span>
                              <span className="font-mono text-zinc-300">{(scoreResult.rf_weight * 100).toFixed(0)}% weight</span>
                            </div>
                            <div className="text-lg font-bold font-mono text-zinc-100">
                              {(scoreResult.rf_fraud_probability * 100).toFixed(1)}%
                            </div>
                            <span className="text-[10px] text-zinc-400">Supervised Fraud Prob</span>
                          </div>

                          <div className="sub-card p-3 rounded-lg border-l-2 border-l-zinc-500">
                            <div className="flex justify-between text-xs text-zinc-400 mb-0.5">
                              <span>Isolation Forest</span>
                              <span className="font-mono text-zinc-300">{(scoreResult.if_weight * 100).toFixed(0)}% weight</span>
                            </div>
                            <div className="text-lg font-bold font-mono text-zinc-100">
                              {(scoreResult.if_anomaly_score * 100).toFixed(1)}%
                            </div>
                            <span className="text-[10px] text-zinc-400">Anomaly Deviation Score</span>
                          </div>
                        </div>
                      </div>

                      {/* Diagnostic Explanations */}
                      <div className="panel-card p-4 rounded-xl space-y-2.5">
                        <span className="text-xs font-semibold text-zinc-300 block">Decision Diagnostics</span>
                        <ul className="space-y-1.5">
                          {scoreResult.explanations.map((item, idx) => (
                            <li key={idx} className="text-xs text-zinc-300 flex items-start gap-2 bg-neutral-900 p-2 rounded border border-zinc-800">
                              <span className="text-accent-400 mt-0.5 font-bold">•</span>
                              <span className="leading-relaxed">{item}</span>
                            </li>
                          ))}
                        </ul>
                      </div>

                    </div>
                  ) : (
                    <div className="panel-card p-8 rounded-xl text-center text-xs text-zinc-400">
                      Evaluating transaction...
                    </div>
                  )}
                </div>

              </div>
            )}

            {/* TAB 2: BATCH EVALUATION */}
            {activeTab === 'batch' && (
              <div className="space-y-5">
                <div className="panel-card p-5 rounded-xl space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-zinc-800">
                    <div>
                      <h2 className="text-sm font-semibold text-zinc-200">Transaction Stream Simulator</h2>
                      <p className="text-xs text-zinc-400">Evaluates live sample batches and generates triage distribution</p>
                    </div>
                    <button
                      onClick={runBatchSimulation}
                      disabled={batchLoading}
                      className="px-3.5 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-100 text-xs font-medium rounded-lg border border-zinc-700 transition-colors disabled:opacity-50"
                    >
                      {batchLoading ? 'Evaluating...' : 'Simulate Stream (50 tx)'}
                    </button>
                  </div>

                  {batchResults && (
                    <div className="space-y-4">
                      <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                        <div className="sub-card p-3 rounded-lg">
                          <span className="text-xs text-zinc-400">Total Stream</span>
                          <div className="text-xl font-bold font-mono text-zinc-100 mt-0.5">{batchResults.total}</div>
                        </div>
                        <div className="sub-card p-3 rounded-lg border-l-2 border-l-emerald-600/70">
                          <span className="text-xs text-zinc-400">Approved</span>
                          <div className="text-xl font-bold font-mono text-emerald-300 mt-0.5">
                            {batchResults.summary.APPROVE || 0}
                            <span className="text-xs font-normal text-zinc-400 ml-1">
                              ({(((batchResults.summary.APPROVE || 0) / batchResults.total) * 100).toFixed(0)}%)
                            </span>
                          </div>
                        </div>
                        <div className="sub-card p-3 rounded-lg border-l-2 border-l-amber-600/70">
                          <span className="text-xs text-zinc-400">Review Queue</span>
                          <div className="text-xl font-bold font-mono text-amber-300 mt-0.5">
                            {batchResults.summary.REVIEW || 0}
                            <span className="text-xs font-normal text-zinc-400 ml-1">
                              ({(((batchResults.summary.REVIEW || 0) / batchResults.total) * 100).toFixed(0)}%)
                            </span>
                          </div>
                        </div>
                        <div className="sub-card p-3 rounded-lg border-l-2 border-l-rose-600/70">
                          <span className="text-xs text-zinc-400">Declined / Flagged</span>
                          <div className="text-xl font-bold font-mono text-rose-300 mt-0.5">
                            {batchResults.summary.FLAG || 0}
                            <span className="text-xs font-normal text-zinc-400 ml-1">
                              ({(((batchResults.summary.FLAG || 0) / batchResults.total) * 100).toFixed(0)}%)
                            </span>
                          </div>
                        </div>
                      </div>

                      <div className="overflow-x-auto rounded-lg border border-zinc-800">
                        <table className="w-full text-left text-xs text-zinc-300">
                          <thead className="bg-neutral-900 text-zinc-400 font-mono text-[10px] uppercase border-b border-zinc-800">
                            <tr>
                              <th className="p-2.5">#</th>
                              <th className="p-2.5">Amount ({currency})</th>
                              <th className="p-2.5">Hour</th>
                              <th className="p-2.5">Supervised RF</th>
                              <th className="p-2.5">Isolation Forest</th>
                              <th className="p-2.5">Risk Score</th>
                              <th className="p-2.5">Decision</th>
                              <th className="p-2.5">True Dataset Label</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-zinc-800/80 font-mono">
                            {batchResults.transactions.map((item, idx) => (
                              <tr key={idx} className="hover:bg-zinc-800/30">
                                <td className="p-2.5 text-zinc-400">{idx + 1}</td>
                                <td className="p-2.5 text-zinc-100 font-medium">{formatAmount(item.amount)}</td>
                                <td className="p-2.5 text-zinc-400">{item.hour.toFixed(1)}h</td>
                                <td className="p-2.5 text-zinc-300">{(item.rf_prob * 100).toFixed(1)}%</td>
                                <td className="p-2.5 text-zinc-300">{(item.if_score * 100).toFixed(1)}%</td>
                                <td className="p-2.5 text-zinc-100 font-bold">{(item.risk_score * 100).toFixed(1)}%</td>
                                <td className="p-2.5">
                                  <span className={`px-2 py-0.5 rounded text-[10px] font-semibold ${
                                    item.action === 'APPROVE' ? 'bg-emerald-950/60 text-emerald-300/90 border border-emerald-900/50' :
                                    item.action === 'REVIEW' ? 'bg-amber-950/60 text-amber-300/90 border border-amber-900/50' :
                                    'bg-rose-950/60 text-rose-300/90 border border-rose-900/50'
                                  }`}>
                                    {item.action}
                                  </span>
                                </td>
                                <td className="p-2.5">
                                  <span className={`text-[10px] px-1.5 py-0.5 rounded ${
                                    item.true_class === 1 ? 'bg-rose-950/80 text-rose-300 font-bold border border-rose-900/40' : 'text-zinc-400'
                                  }`}>
                                    {item.true_class === 1 ? 'Confirmed Fraud' : 'Legitimate'}
                                  </span>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB 3: MODEL METRICS */}
            {activeTab === 'metrics' && modelInfo && (
              <div className="space-y-5">
                <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                  <div className="panel-card p-4 rounded-xl">
                    <span className="text-xs text-zinc-400">Overall Accuracy</span>
                    <div className="text-2xl font-bold font-mono text-emerald-400/90 mt-1">
                      {(modelInfo.metrics.accuracy * 100).toFixed(2)}%
                    </div>
                    <span className="text-[10px] text-zinc-400">56,961 holdout test rows</span>
                  </div>
                  <div className="panel-card p-4 rounded-xl">
                    <span className="text-xs text-zinc-400">Fraud Recall</span>
                    <div className="text-2xl font-bold font-mono text-accent-300 mt-1">
                      {(modelInfo.metrics.recall * 100).toFixed(2)}%
                    </div>
                    <span className="text-[10px] text-zinc-400">Caught {modelInfo.metrics.tp}/{modelInfo.metrics.tp + modelInfo.metrics.fn} frauds</span>
                  </div>
                  <div className="panel-card p-4 rounded-xl">
                    <span className="text-xs text-zinc-400">Precision</span>
                    <div className="text-2xl font-bold font-mono text-zinc-200 mt-1">
                      {(modelInfo.metrics.precision * 100).toFixed(2)}%
                    </div>
                    <span className="text-[10px] text-zinc-400">Low false alarm rate</span>
                  </div>
                  <div className="panel-card p-4 rounded-xl">
                    <span className="text-xs text-zinc-400">F1-Score</span>
                    <div className="text-2xl font-bold font-mono text-zinc-200 mt-1">
                      {modelInfo.metrics.f1.toFixed(4)}
                    </div>
                    <span className="text-[10px] text-zinc-400">Harmonic mean</span>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                  <div className="panel-card p-5 rounded-xl space-y-3">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-zinc-300">Confusion Matrix</h3>
                    <div className="grid grid-cols-2 gap-3 font-mono text-center">
                      <div className="sub-card p-3 rounded-lg border border-zinc-800">
                        <span className="text-[11px] text-zinc-400 block">True Negatives</span>
                        <div className="text-xl font-bold text-emerald-300/90">{modelInfo.metrics.tn.toLocaleString()}</div>
                        <span className="text-[10px] text-zinc-400">Legitimate cleared</span>
                      </div>
                      <div className="sub-card p-3 rounded-lg border border-zinc-800">
                        <span className="text-[11px] text-zinc-400 block">False Positives</span>
                        <div className="text-xl font-bold text-amber-300/90">{modelInfo.metrics.fp.toLocaleString()}</div>
                        <span className="text-[10px] text-zinc-400">Legitimate flagged (0.09%)</span>
                      </div>
                      <div className="sub-card p-3 rounded-lg border border-zinc-800">
                        <span className="text-[11px] text-zinc-400 block">False Negatives</span>
                        <div className="text-xl font-bold text-rose-300/90">{modelInfo.metrics.fn.toLocaleString()}</div>
                        <span className="text-[10px] text-zinc-400">Missed frauds</span>
                      </div>
                      <div className="sub-card p-3 rounded-lg border border-zinc-800">
                        <span className="text-[11px] text-zinc-400 block">True Positives</span>
                        <div className="text-xl font-bold text-zinc-100">{modelInfo.metrics.tp.toLocaleString()}</div>
                        <span className="text-[10px] text-zinc-400">Frauds intercepted</span>
                      </div>
                    </div>
                  </div>

                  <div className="panel-card p-5 rounded-xl space-y-3 text-xs text-zinc-300">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-zinc-300">Dataset & Currency Context</h3>
                    <p className="leading-relaxed text-zinc-400">
                      The dataset comprises 284,807 transactions made by European cardholders in September 2013 (with amounts recorded in <strong className="text-zinc-200">Euros €</strong>).
                    </p>
                    <div className="space-y-2 pt-1">
                      <div className="p-2.5 rounded bg-neutral-900 border border-zinc-800">
                        <span className="font-semibold text-zinc-200">Currency Conversion:</span>
                        <p className="text-zinc-400 mt-0.5">The dashboard includes a real-time multi-currency converter (EUR, INR ₹, USD $, GBP £) so amounts can be analyzed in any preferred denomination.</p>
                      </div>
                      <div className="p-2.5 rounded bg-neutral-900 border border-zinc-800">
                        <span className="font-semibold text-zinc-200">Class Imbalance Handling:</span>
                        <p className="text-zinc-400 mt-0.5">Only 0.173% of transactions are fraudulent. The Random Forest model applies balanced bagging, while the Isolation Forest learns normal spending baseline.</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="border-t border-zinc-800/80 py-4 text-center text-xs text-zinc-400 font-mono">
            Fraud Risk Analyser • Built with FastAPI & React 18
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
